<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16294b">
<title>Burns Club Golf GPS</title>
<style>
:root{
 --navy:#16294b;
 --navy2:#0d1b33;
 --navy3:#223a64;
 --gold:#e6a400;
 --gold2:#ffc23d;
 --cream:#f6f1e7;
 --white:#fff;
 --muted:#bbc5d4;
 --line:rgba(255,255,255,.16);
 --red:#d8493f;
 --blue:#3c7fd6;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--navy2);color:var(--white)}
body{min-height:100dvh;background:linear-gradient(160deg,#0b172c,#172d50 58%,#10213c);overflow-x:hidden}
button{font:inherit}
.app{
 min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;
 padding:calc(10px + env(safe-area-inset-top)) calc(64px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))
}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand-hole{display:flex;align-items:center;gap:10px;min-width:0}
.logo-card{display:flex;align-items:center;background:#fff;border-radius:10px;padding:5px 8px;height:48px}
.logo-card img{display:block;height:36px;width:auto;max-width:185px}
.hole-badge{display:flex;align-items:center;gap:9px;background:rgba(10,26,50,.88);border:1px solid var(--line);border-radius:11px;padding:6px 9px}
.hole-mini{text-align:center;min-width:36px}
.hole-mini .label{font-size:8px;letter-spacing:.09em;font-weight:800;color:var(--muted)}
.hole-mini .num{font-size:24px;line-height:1;font-weight:900}
.sep{width:1px;height:30px;background:var(--line)}
.status-wrap{text-align:right}
.status{font-size:9px;color:var(--muted)}



.wind-arrow{display:inline-block;margin-right:3px;transform-origin:center}
.main{min-height:0;display:flex;align-items:center;justify-content:center}
.distance-wrap{width:100%;max-width:680px;text-align:center}
.distance-title{font-size:clamp(13px,4vw,23px);font-weight:900;letter-spacing:.16em;color:var(--muted)}
.distance-line{white-space:nowrap;line-height:.84}
.distance{font-size:clamp(84px,29vw,240px);font-weight:900;letter-spacing:-.055em;color:var(--gold2);text-shadow:0 2px 20px rgba(230,164,0,.12)}
.unit{margin-left:6px;font-size:clamp(31px,9vw,70px);font-weight:900;color:var(--gold2)}
.sub{margin-top:9px;font-size:10px;color:var(--muted)}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
.readout{padding:8px 5px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.055)}
.rlabel{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.rvalue{margin-top:2px;font-size:clamp(16px,5vw,25px);font-weight:900}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:50px;border:1px solid var(--line);border-radius:13px;background:var(--navy3);color:#fff;font-size:14px;font-weight:900}
.btn.primary{background:var(--gold);color:#14233f;border-color:transparent}
.tabs{position:fixed;top:50%;right:0;z-index:50;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px}
.tab{width:53px;min-height:84px;border:1px solid rgba(255,255,255,.18);border-right:0;border-radius:12px 0 0 12px;background:#243b62;color:#fff;font-size:10px;font-weight:900;letter-spacing:.04em;writing-mode:vertical-rl;transform:rotate(180deg);cursor:pointer;padding:7px 4px}
.tab.active{background:var(--gold);color:#14233f}
.dim{position:fixed;inset:0;z-index:30;background:rgba(3,8,16,.56);opacity:0;pointer-events:none;transition:opacity .25s}
.dim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;z-index:40;width:min(88vw,680px);height:100dvh;background:#0c1930;box-shadow:-20px 0 50px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{min-height:58px;padding:calc(10px + env(safe-area-inset-top)) 62px 10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.drawer-title{font-size:20px;font-weight:900;color:var(--gold2)}
.drawer-content{flex:1;min-height:0;overflow:auto;padding:12px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 14px}
.panel-card{max-width:720px;margin:0 auto;padding:16px;border:1px solid var(--line);border-radius:16px;background:#142845}
.panel-card h2{margin:0 0 12px;font-size:23px}
.panel-card p{font-size:16px;line-height:1.5;color:#eef2f8;margin:0}
.info-row{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0}
.tee-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.75)}
.tee-dot.blue{background:var(--blue)} .tee-dot.red{background:var(--red)}
.info-name{font-weight:900}
.info-distance{font-size:22px;font-weight:900;color:var(--gold2)}
.info-par{font-size:12px;color:var(--muted);margin-top:2px}
.image-wrap{height:calc(100dvh - 92px);display:flex;align-items:center;justify-content:center;padding:6px;background:#0c1930}
.image-wrap img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}


@media(max-width:520px) and (orientation:portrait){
 .app{padding-right:60px;gap:7px}
 .logo-card{height:40px;padding:4px 6px}.logo-card img{height:29px;max-width:135px}
 .hole-badge{padding:5px 7px;gap:6px}.hole-mini{min-width:31px}.hole-mini .num{font-size:21px}.sep{height:27px}
 .status-wrap{max-width:92px}
 .distance{font-size:clamp(82px,27vw,150px)}.unit{font-size:clamp(27px,8vw,43px)}.distance-title{font-size:11px}
 .readouts{margin-top:9px}.rvalue{font-size:17px}.btn{min-height:45px;font-size:12px}
 .tab{width:49px;min-height:76px;font-size:9px}
 .panel-card p{font-size:15px}.drawer{width:91vw}
}
@media(max-height:520px) and (orientation:landscape){
 .app{grid-template-columns:minmax(245px,34vw) 1fr;grid-template-rows:1fr auto;gap:7px 12px;padding:7px 58px 7px 8px}
 .topbar{grid-column:1;grid-row:1;display:block;overflow:auto}.brand-hole{align-items:flex-start;flex-wrap:wrap}
 .logo-card{height:34px}.logo-card img{height:25px;max-width:125px}.hole-badge{padding:4px 6px}.hole-mini .num{font-size:19px}.sep{height:24px}
 .status-wrap{text-align:left;margin-top:5px}
 .main{grid-column:2;grid-row:1}.distance{font-size:clamp(78px,18vw,145px)}.unit{font-size:clamp(26px,5vw,43px)}.distance-title{font-size:10px}.sub{margin-top:4px;font-size:8px}
 .readouts{margin-top:7px;gap:4px}.readout{padding:5px 3px}.rvalue{font-size:15px}
 .nav{grid-column:1/-1;grid-row:2}.btn{min-height:37px;font-size:11px}
 .tab{width:46px;min-height:68px;font-size:8px}
 .drawer{width:min(68vw,620px)}.drawer-header{min-height:45px;padding-top:7px;padding-bottom:7px}.drawer-title{font-size:16px}
 .drawer-content{padding:8px 10px 10px}.panel-card{padding:12px}.panel-card h2{font-size:18px}.panel-card p{font-size:12px;line-height:1.35}
 .image-wrap{height:calc(100dvh - 72px)}
}

.main-weather{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
.main-weather-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:128px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  font-size:11px;
}
.main-weather-item strong{
  color:#fff;
  font-size:13px;
}
.mw-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.wind-arrow{
  display:inline-block;
  transform-origin:center;
  font-size:16px;
  color:var(--gold2);
}
.drawer.map-only .drawer-header{
  display:none;
}
.drawer.map-only .drawer-content{
  padding:0;
}
.drawer.map-only .image-wrap{
  height:100dvh;
  padding:0;
  background:#0c1930;
}
.drawer.map-only .image-wrap img{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:0;
}
@media(max-width:520px) and (orientation:portrait){
  .main-weather{gap:5px;margin-top:8px}
  .main-weather-item{min-width:108px;padding:6px 7px;font-size:9px}
  .main-weather-item strong{font-size:11px}
  .mw-label{font-size:8px}
}
@media(max-height:520px) and (orientation:landscape){
  .main-weather{gap:4px;margin-top:6px}
  .main-weather-item{min-width:95px;padding:4px 6px}
  .main-weather-item strong{font-size:10px}
  .mw-label{font-size:8px}
}


.drawer.image-only .drawer-header{display:none}
.drawer.image-only .drawer-content{padding:0}
.drawer.image-only .image-wrap{width:100%;height:100dvh;padding:0;background:#0c1930;display:flex;align-items:center;justify-content:center}
.drawer.image-only .image-wrap img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border-radius:0;box-shadow:none}

</style>
</head>

/16.png"}, "17": {"front": [-35.227136136582416, 149.00397640773656], "middle": [-35.22721556104981, 149.00399652430318], "back": [-35.227293889931175, 149.00401529976534], "par": "5", "blue": 480, "red": 465, "tip": "Drive down the left-hand side of the fairway to avoid the ball bouncing into the trees on the right. A second shot positioned halfway up the hill is an ideal place to attack this elevated but flat green. Players who miss to the right of this green will be faced with a difficult up and down.", "mapPath": "./renderedholes/Burns17.png", "greenPath": "./greens/17.png"}, "18": {"front": [-35.22805922129916, 149.00251864717256], "middle": [-35.228134262875294, 149.0024582974727], "back": [-35.22821149537386, 149.00241202936954], "par": "3", "blue": 134, "red": 134, "tip": "A shot up the hill to a small flat green. Long grass awaits any shot coming up short or right. The wind can make this hole play harder than its rating.", "mapPath": "./renderedholes/Burns18.png", "greenPath": "./greens/18.png"}};
let currentHole=1,currentPosition=null,openPanelName=null;
let lastWeatherFetch=0,lastWeatherLat=null,lastWeatherLon=null;
const $=id=>document.getElementById(id);

function toRad(d){return d*Math.PI/180}
function distanceMetres(a,b,c,d){
 const R=6371000,p1=toRad(a),p2=toRad(c),dp=toRad(c-a),dl=toRad(d-b);
 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function renderHole(){
 const h=HOLES[currentHole];
 $("holeNum").textContent=currentHole;$("parNum").textContent=h.par;
 $("infoHeading").textContent=`Hole ${currentHole} Info`;
 $("bluePar").textContent=`Par ${h.par}`;$("redPar").textContent=`Par ${h.par}`;
 $("blueDistance").textContent=h.blue+" m";$("redDistance").textContent=h.red+" m";
 $("tipHeading").textContent=`Hole ${currentHole} Tip`;$("tipText").textContent=h.tip;
 $("greenImage").src=h.greenPath;
 $("mapImage").src=h.mapPath;
 renderDistances();
}
function renderDistances(){
 const h=HOLES[currentHole];
 if(!currentPosition){
  $("distance").textContent="--";$("frontDistance").textContent="-- m";$("middleDistance").textContent="-- m";$("backDistance").textContent="-- m";return;
 }
 const f=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.front[0],h.front[1]));
 const m=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.middle[0],h.middle[1]));
 const b=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.back[0],h.back[1]));
 $("distance").textContent=m;$("frontDistance").textContent=f+" m";$("middleDistance").textContent=m+" m";$("backDistance").textContent=b+" m";
 $("accuracyText").textContent="GPS accuracy ±"+Math.round(currentPosition.accuracy)+" m";
}
function changeHole(delta){
 currentHole+=delta;if(currentHole<1)currentHole=18;if(currentHole>18)currentHole=1;
 closeDrawer();renderHole();
}
$("prevBtn").onclick=()=>changeHole(-1);$("nextBtn").onclick=()=>changeHole(1);

function degreesToCompass(deg){
 const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
 return dirs[Math.round((((deg%360)+360)%360)/22.5)%16];
}
async function updateWeather(lat,lon){
 const now=Date.now();
 const moved=lastWeatherLat===null||distanceMetres(lat,lon,lastWeatherLat,lastWeatherLon)>500;
 if(!moved&&(now-lastWeatherFetch)<10*60*1000)return;
 try{
  const url="https://api.open-meteo.com/v1/forecast?latitude="+encodeURIComponent(lat)+"&longitude="+encodeURIComponent(lon)+"&current=temperature_2m,wind_speed_10m,wind_direction_10m&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto";
  const r=await fetch(url,{cache:"no-store"});const d=await r.json();const c=d.current;
  $("weatherTemp").textContent=Math.round(c.temperature_2m)+"°C";
  $("windSpeed").textContent=Math.round(c.wind_speed_10m)+" km/h";
  $("windDirection").textContent=degreesToCompass(c.wind_direction_10m);
  $("windArrow").style.transform="rotate("+((c.wind_direction_10m+180)%360)+"deg)";
  lastWeatherFetch=now;lastWeatherLat=lat;lastWeatherLon=lon;
 }catch(e){}
}
if("geolocation" in navigator){
 navigator.geolocation.watchPosition(pos=>{
  currentPosition={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};
  $("gpsStatus").textContent="GPS: active";renderDistances();updateWeather(currentPosition.latitude,currentPosition.longitude);
 },err=>{
  $("gpsStatus").textContent="GPS: unavailable";
  let msg="Unable to get GPS location.";
  if(err.code===1) msg="Location permission denied. Allow location access for this site.";
  else if(err.code===2) msg="GPS position unavailable. Try moving outdoors or enabling precise location.";
  else if(err.code===3) msg="GPS request timed out. Retrying…";
  $("accuracyText").textContent=msg;
 },{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}else $("gpsStatus").textContent="GPS: not supported";

const drawer=$("drawer"),dim=$("dim");
const panels={info:$("infoPanel"),tip:$("tipPanel"),green:$("greenPanel"),map:$("mapPanel")};
const tabs={info:$("infoTab"),tip:$("tipTab"),green:$("greenTab"),map:$("mapTab")};
const titles={info:"Hole Info",tip:"Hole Tip",green:"Green Detail",map:"Hole Map"};
function showPanel(name){
 if(drawer.classList.contains("open")&&openPanelName===name){closeDrawer();return}
 openPanelName=name;
 Object.keys(panels).forEach(k=>panels[k].style.display=k===name?"block":"none");
 Object.keys(tabs).forEach(k=>tabs[k].classList.toggle("active",k===name));
 $("drawerTitle").textContent=titles[name];

 if(name==="map" || name==="green"){
   drawer.classList.add("image-only");
 }else{
   drawer.classList.remove("map-only");
   drawer.classList.remove("image-only");
 }

 drawer.classList.add("open");
 dim.classList.add("show");
}
function closeDrawer(){
 drawer.classList.remove("open");
 drawer.classList.remove("map-only");
 drawer.classList.remove("image-only");
 dim.classList.remove("show");
 Object.values(tabs).forEach(t=>t.classList.remove("active"));
 openPanelName=null;
}
Object.keys(tabs).forEach(k=>tabs[k].onclick=()=>showPanel(k));
dim.onclick=closeDrawer;
$("greenImage").onerror = () => {
  console.error(`Could not load ./greens/${currentHole}.png`);
};
$("mapImage").onerror = () => {

};
renderHole();
</script>
