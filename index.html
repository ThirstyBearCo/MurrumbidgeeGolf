<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a11">
<title>Murrumbidgee Country Club GPS</title>

<style>
:root{
  --bg:#071a11;
  --panel:#0d2a1c;
  --panel2:#123621;
  --accent:#d7ff69;
  --text:#fff;
  --muted:#b7c7bd;
  --line:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
body{
  min-height:100dvh;
  background:linear-gradient(180deg,#071a11,#0b281a);
  overflow-x:hidden;
}
button{font:inherit}

.app{
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
  padding:
    calc(10px + env(safe-area-inset-top))
    calc(64px + env(safe-area-inset-right))
    calc(10px + env(safe-area-inset-bottom))
    calc(10px + env(safe-area-inset-left));
}

.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.hole-meta{
  min-width:0;
  max-width:100%;
}

.hole-badge{
  display:flex;
  align-items:center;
  gap:10px;
  width:max-content;
  max-width:100%;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:#0b2c1c;
}
.hole-mini{
  text-align:center;
  min-width:42px;
}
.hole-mini .label{
  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;
  color:var(--muted);
}
.hole-mini .num{
  font-size:28px;
  line-height:1;
  font-weight:900;
}
.sep{
  width:1px;
  height:34px;
  background:var(--line);
}

.course-name{
  margin-top:7px;
  font-size:12px;
  font-weight:900;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tee-info{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  width:min(100%,390px);
  margin-top:6px;
  padding:0;
  border:0;
  background:transparent;
}
.tee-row{
  display:block;
  min-width:0;
  padding:7px 7px 6px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.045);
}
.tee-row:last-child{border-bottom:1px solid var(--line)}
.tee-dot{
  display:inline-block;
  width:9px;
  height:9px;
  margin:0 5px 0 0;
  vertical-align:middle;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.75);
}
.tee-dot.blue{background:#1747c7}
.tee-dot.white{background:#fff}
.tee-dot.red{background:#e52525}
.tee-name{
  display:inline;
  font-size:10px;
  font-weight:900;
}
.tee-details{
  display:grid;
  gap:2px;
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
  line-height:1.15;
}
.tee-details strong{color:#fff}

.status{
  flex:0 0 auto;
  padding-top:4px;
  font-size:10px;
  color:var(--muted);
  text-align:right;
  white-space:nowrap;
}

.main{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.distance-wrap{
  width:100%;
  max-width:680px;
  text-align:center;
}
.distance-title{
  font-size:clamp(14px,4vw,24px);
  font-weight:800;
  letter-spacing:.15em;
  color:var(--muted);
}
.distance-line{
  white-space:nowrap;
  line-height:.82;
}
.distance{
  font-size:clamp(84px,29vw,240px);
  font-weight:900;
  letter-spacing:-.055em;
  color:var(--accent);
}
.unit{
  margin-left:6px;
  font-size:clamp(32px,9vw,72px);
  font-weight:900;
  color:var(--accent);
}
.sub{
  margin-top:10px;
  font-size:11px;
  color:var(--muted);
}

.readouts{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:14px;
}
.readout{
  min-width:0;
  padding:8px 5px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.055);
}
.rlabel{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.07em;
}
.rvalue{
  margin-top:2px;
  font-size:clamp(16px,5vw,25px);
  font-weight:900;
}

.nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.btn{
  min-height:50px;
  padding:8px 12px;
  border:0;
  border-radius:13px;
  background:#153c29;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.btn.primary{
  background:var(--accent);
  color:#17200c;
}

.tabs{
  position:fixed;
  top:50%;
  right:0;
  z-index:40;
  transform:translateY(-50%);
}
.tab{
  width:54px;
  min-height:96px;
  padding:8px 5px;
  border:1px solid rgba(255,255,255,.13);
  border-right:0;
  border-radius:13px 0 0 13px;
  background:#123621;
  color:#fff;
  font-size:12px;
  font-weight:900;
  letter-spacing:.04em;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  cursor:pointer;
}
.tab.active{
  background:var(--accent);
  color:#17200c;
}

.dim{
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.42);
  opacity:0;
  pointer-events:none;
  transition:opacity .28s ease;
}
.dim.show{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  top:0;
  right:0;
  z-index:30;
  width:min(86vw,560px);
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#07140e;
  box-shadow:-18px 0 45px rgba(0,0,0,.45);
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.drawer.open{
  transform:translateX(0);
}
.drawer-header{
  min-height:58px;
  display:flex;
  align-items:center;
  padding:
    calc(10px + env(safe-area-inset-top))
    64px
    10px
    16px;
  border-bottom:1px solid var(--line);
  background:#0a2116;
}
.drawer-title{
  font-size:20px;
  font-weight:900;
}
.drawer-content{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:
    12px
    calc(14px + env(safe-area-inset-right))
    calc(14px + env(safe-area-inset-bottom))
    14px;
}
.tip-panel{
  max-width:680px;
  margin:0 auto;
  padding:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#0d2a1c;
}
.tip-panel h2{
  margin:0 0 10px;
  font-size:23px;
}
.tip-panel p{
  margin:0 0 14px;
  font-size:16px;
  line-height:1.45;
  color:#eaf0ec;
}
.tip-panel p:last-child{margin-bottom:0}

/* Small portrait phones */
@media (max-width:430px) and (orientation:portrait){
  .app{
    gap:7px;
    padding-right:60px;
  }
  .topbar{
    gap:6px;
  }
  .hole-badge{
    gap:7px;
    padding:6px 8px;
  }
  .hole-mini{min-width:36px}
  .hole-mini .label{font-size:8px}
  .hole-mini .num{font-size:24px}
  .sep{height:30px}
  .course-name{
    max-width:230px;
    font-size:10px;
  }
  .tee-info{
    width:min(100%,270px);
    gap:4px;
  }
  .tee-row{padding:5px}
  .tee-name{font-size:8.5px}
  .tee-details{font-size:8px}
  .status{
    max-width:90px;
    font-size:8.5px;
    white-space:normal;
  }
  .distance{
    font-size:clamp(82px,27vw,150px);
  }
  .unit{
    font-size:clamp(28px,8vw,44px);
  }
  .distance-title{font-size:12px}
  .readouts{margin-top:10px}
  .rvalue{font-size:17px}
  .nav .btn{
    min-height:46px;
    font-size:13px;
  }
}

/* Landscape phones */
@media (max-height:520px) and (orientation:landscape){
  body{overflow:hidden}
  .app{
    grid-template-columns:minmax(250px,34vw) 1fr;
    grid-template-rows:1fr auto;
    column-gap:12px;
    row-gap:7px;
    padding:
      calc(7px + env(safe-area-inset-top))
      calc(60px + env(safe-area-inset-right))
      calc(7px + env(safe-area-inset-bottom))
      calc(8px + env(safe-area-inset-left));
  }
  .topbar{
    grid-column:1;
    grid-row:1;
    display:block;
    min-width:0;
    overflow:auto;
  }
  .status{
    margin-top:6px;
    text-align:left;
    font-size:8px;
  }
  .hole-badge{
    padding:5px 8px;
  }
  .hole-mini .num{font-size:22px}
  .sep{height:28px}
  .course-name{
    max-width:100%;
    margin-top:5px;
    font-size:9px;
  }
  .tee-info{
    grid-template-columns:1fr;
    width:100%;
    gap:3px;
    margin-top:5px;
  }
  .tee-row{
    display:grid;
    grid-template-columns:1fr;
    padding:4px 6px;
  }
  .tee-details{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:2px;
    font-size:8px;
  }
  .main{
    grid-column:2;
    grid-row:1;
    min-width:0;
  }
  .distance-title{
    font-size:11px;
  }
  .distance{
    font-size:clamp(82px,19vw,155px);
  }
  .unit{
    font-size:clamp(28px,5vw,45px);
  }
  .sub{
    margin-top:5px;
    font-size:9px;
  }
  .readouts{
    margin-top:8px;
    gap:5px;
  }
  .readout{
    padding:5px 4px;
  }
  .rlabel{font-size:8px}
  .rvalue{font-size:16px}
  .nav{
    grid-column:1 / -1;
    grid-row:2;
  }
  .btn{
    min-height:38px;
    font-size:12px;
  }
  .tab{
    width:48px;
    min-height:82px;
    font-size:10px;
  }
  .drawer{
    width:min(64vw,520px);
  }
  .drawer-header{
    min-height:46px;
    padding-top:8px;
    padding-bottom:8px;
  }
  .drawer-title{font-size:17px}
  .drawer-content{padding:8px 12px 10px}
  .tip-panel{
    padding:12px;
  }
  .tip-panel h2{font-size:18px}
  .tip-panel p{
    margin-bottom:9px;
    font-size:13px;
    line-height:1.35;
  }
}

/* Tablets and larger screens */
@media (min-width:768px) and (min-height:600px){
  .app{
    gap:14px;
    padding:
      calc(18px + env(safe-area-inset-top))
      calc(84px + env(safe-area-inset-right))
      calc(18px + env(safe-area-inset-bottom))
      calc(18px + env(safe-area-inset-left));
  }
  .hole-badge{padding:10px 16px}
  .hole-mini{min-width:56px}
  .hole-mini .label{font-size:12px}
  .hole-mini .num{font-size:40px}
  .sep{height:46px}
  .course-name{font-size:15px}
  .tee-info{
    width:350px;
    gap:7px;
  }
  .tee-row{padding:9px}
  .tee-name{font-size:12px}
  .tee-details{font-size:11px}
  .status{font-size:13px}
  .distance-title{font-size:24px}
  .distance{font-size:clamp(170px,22vw,290px)}
  .unit{font-size:clamp(54px,7vw,88px)}
  .sub{font-size:15px}
  .readout{padding:12px 10px}
  .rlabel{font-size:12px}
  .rvalue{font-size:26px}
  .btn{min-height:62px;font-size:20px}
  .tab{
    width:70px;
    min-height:112px;
    font-size:15px;
  }
}
</style>

</head>
<body>
<div class="app">

</div>

<div class="dim" id="dim"></div>

let currentHole = 1;
let currentPosition = null;
const $ = id => document.getElementById(id);

function toRad(deg){return deg*Math.PI/180}
function distanceMetres(lat1,lon1,lat2,lon2){
 const R=6371000,p1=toRad(lat1),p2=toRad(lat2),dp=toRad(lat2-lat1),dl=toRad(lon2-lon1);
 const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function teeRow(name,c){
 return `<div class="tee-row"><span class="tee-dot ${name.toLowerCase()}"></span><div>
 <div class="tee-name">${name} Course</div>
 <div class="tee-details"><span>Distance <strong>${c.distance} m</strong></span><span>Par <strong>${c.par}</strong></span><span>Index <strong>${c.index}</strong></span></div>
 </div></div>`;
}
function renderHole(){
 const h=HOLES[currentHole];
 $("holeNum").textContent=currentHole;
 $("parNum").textContent=h.courses.blue?.par ?? "-";
 $("teeInfo").innerHTML=["Blue","White","Red"].map(n=>teeRow(n,h.courses[n.toLowerCase()])).join("");
 $("tipHeading").textContent=`Hole ${currentHole} Tip`;
 $("tipText").innerHTML=h.tip.map(p=>`<p>${p}</p>`).join("");
 renderDistances();
}
function renderDistances(){
 const h=HOLES[currentHole];
 if(!currentPosition){
   $("distance").textContent="--";
   $("frontDistance").textContent="-- m"; $("middleDistance").textContent="-- m"; $("backDistance").textContent="-- m";
   return;
 }
 const f=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.front[0],h.front[1]));
 const m=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.middle[0],h.middle[1]));
 const b=Math.round(distanceMetres(currentPosition.latitude,currentPosition.longitude,h.back[0],h.back[1]));
 $("distance").textContent=m;
 $("frontDistance").textContent=f+" m"; $("middleDistance").textContent=m+" m"; $("backDistance").textContent=b+" m";
 $("accuracyText").textContent="GPS accuracy ±"+Math.round(currentPosition.accuracy)+" m";
}
function changeHole(delta){
 currentHole+=delta;
 if(currentHole<1)currentHole=18;
 if(currentHole>18)currentHole=1;
 closeDrawer(); renderHole();
}
$("prevBtn").addEventListener("click",()=>changeHole(-1));
$("nextBtn").addEventListener("click",()=>changeHole(1));

if("geolocation" in navigator){
 navigator.geolocation.watchPosition(
  pos=>{
   currentPosition={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};
   $("gpsStatus").textContent="GPS: active"; renderDistances();
  },
  err=>{
   $("gpsStatus").textContent="GPS: unavailable";
   $("accuracyText").textContent=err.code===1?"Location permission denied. Enable location access for this site.":"Unable to get your GPS location.";
  },
  {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
 );
}else $("gpsStatus").textContent="GPS: not supported";

const drawer=$("drawer"),dim=$("dim"),tipTab=$("tipTab");
function openTip(){drawer.classList.add("open");dim.classList.add("show");tipTab.classList.add("active")}
function closeDrawer(){drawer.classList.remove("open");dim.classList.remove("show");tipTab.classList.remove("active")}
tipTab.addEventListener("click", () => {
  if (drawer.classList.contains("open")) {
    closeDrawer();
  } else {
    openTip();
  }
});
dim.addEventListener("click",closeDrawer);

renderHole();
</script>
</body>
